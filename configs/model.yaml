# LightGBM baseline credit scorer configuration.
seed: 42
n_folds: 5
early_stopping_rounds: 50

lgbm:
  objective: binary
  metric: auc
  boosting_type: gbdt
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 0.0
  n_estimators: 2000
  verbosity: -1
  n_jobs: -1

# No class weights, scale_pos_weight, or resampling (natural 8.1% positive rate).

outputs:
  save_fold_models: true
  save_feature_importance: true
  save_roc_plot: true
